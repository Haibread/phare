[project]
name = "phare"
version = "0.1.0"
description = "Self-hosted, AI-assisted movie & TV recommendation engine"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "Haibread", email = "theobarbou@gmail.com" },
]
dependencies = [
    "fastapi>=0.162.7",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.1.8",
    "psycopg[binary]>=3.2",
    "alembic>=1.20.1",
    "typer>=0.29.1",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-otlp-proto-http>=1.29",
    "opentelemetry-instrumentation-fastapi>=0.50b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pgvector>=0.5.1",
    "cryptography>=50.0.2",
    "argon2-cffi>=25.1.0",
]

[project.urls]
Repository = "https://github.com/Haibread/phare"

[project.scripts]
phare = "phare.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phare"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# The offline sample catalog is a data module: real TMDB synopsis strings run past the line length
# and shouldn't be wrapped or truncated. Every other rule (and the formatter) still applies to it.
"src/phare/catalog/sample.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
