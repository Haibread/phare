server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: every unknown path resolves to index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache fingerprinted assets; never cache the HTML entry point.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
