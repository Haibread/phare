services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phare}
      POSTGRES_DB: ${POSTGRES_DB:-phare}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-phare} -d ${POSTGRES_DB:-phare}
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-phare}:${POSTGRES_PASSWORD:-phare}@db:5432/${POSTGRES_DB:-phare}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
      MIGRATE_ON_STARTUP: ${MIGRATE_ON_STARTUP:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SERVICE_NAME: ${SERVICE_NAME:-phare-backend}
      # Auth (multi-user, closed by default — see docs/auth.md). SECRET_KEY is required once an
      # account exists; the first account created is the admin.
      SECRET_KEY: ${SECRET_KEY:-}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN:-}
      PLEX_CLIENT_IDENTIFIER: ${PLEX_CLIENT_IDENTIFIER:-}
      PLEX_PRODUCT_NAME: ${PLEX_PRODUCT_NAME:-Phare}
      # LLM + embeddings (OpenAI-compatible; blank = offline). Any provider that speaks the API.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-gpt-4o-mini}
      LLM_AGENT_MODEL: ${LLM_AGENT_MODEL:-}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-3-small}
      LLM_EMBEDDING_DIM: ${LLM_EMBEDDING_DIM:-1536}
      LLM_EMBEDDING_REQUEST_DIMENSIONS: ${LLM_EMBEDDING_REQUEST_DIMENSIONS:-false}
      LLM_REASONING_MODEL: ${LLM_REASONING_MODEL:-false}
      LLM_REASONING_HEADROOM: ${LLM_REASONING_HEADROOM:-4096}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      # Metadata + sources (blank = sample-data path only)
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_CACHE_TTL_SECONDS: ${TMDB_CACHE_TTL_SECONDS:-3600}
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:-}
      TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET:-}
      SEERR_BASE_URL: ${SEERR_BASE_URL:-}
      SEERR_API_KEY: ${SEERR_API_KEY:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      # No curl/wget in the slim Python image — probe /health with the stdlib instead.
      test:
        - CMD-SHELL
        - python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      # busybox wget ships in the nginx-alpine image. Probe 127.0.0.1, not localhost: the container's
      # /etc/hosts maps localhost to ::1 first, busybox wget resolves to IPv6 and does not retry in
      # IPv4, and nginx listens only on 0.0.0.0:8080 — so localhost gives a false "unhealthy".
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata: {}
