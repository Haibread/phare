services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phare}
      POSTGRES_DB: ${POSTGRES_DB:-phare}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-phare} -d ${POSTGRES_DB:-phare}
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-phare}:${POSTGRES_PASSWORD:-phare}@db:5432/${POSTGRES_DB:-phare}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      SERVICE_NAME: ${SERVICE_NAME:-phare-backend}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  pgdata: {}
