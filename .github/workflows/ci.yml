name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: phare
          POSTGRES_PASSWORD: phare
          POSTGRES_DB: phare
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U phare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  evaluation:
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: phare
          POSTGRES_PASSWORD: phare
          POSTGRES_DB: phare
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U phare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run phare migrate
      - name: Persona guardrails + anti-degeneracy metrics
        run: uv run phare evaluate
      - name: Conversion metric smoke (empty DB → n/a)
        run: uv run phare conversion

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: phare
          POSTGRES_PASSWORD: phare
          POSTGRES_DB: phare
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U phare"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend deps
        working-directory: backend
        run: uv sync --frozen
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Install e2e deps
        working-directory: e2e
        run: npm ci
      - name: Install Playwright browser
        working-directory: e2e
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: e2e
        run: npm test
