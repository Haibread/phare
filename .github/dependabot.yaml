version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # The SDK, exporter and instrumentations only work against the matching
      # opentelemetry-api release: bumped one at a time, they conflict.
      opentelemetry:
        patterns:
          - opentelemetry*
      minor-and-patch:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - opentelemetry*

  - package-ecosystem: npm
    directories:
      - /frontend
      - /e2e
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      hooks:
        patterns:
          - "*"
